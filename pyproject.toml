[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "budgetbuddy"
version = "1.0.0a1"
description = "Local, private joint finance dashboard: bank and Vanguard ISA imports, spending and forecasts."
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "pandas>=2.2", "plotly>=5.24", "streamlit>=1.45"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
budgetbuddy = "budgetbuddy.cli:main"

[tool.setuptools.packages.find]
include = ["budgetbuddy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
